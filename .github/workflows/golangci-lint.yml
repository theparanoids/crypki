name: golangci-lint
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
env:
  GO_VERSION: 1.26.2
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '${{ env.GO_VERSION }}'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6.5.2
        with:
          # Every released golangci-lint v1 binary is built with Go 1.24 or
          # older, and it refuses to run against a module targeting a newer
          # Go than it was built with:
          #   the Go language version (go1.24) used to build golangci-lint is
          #   lower than the targeted Go version (1.26.2)
          # Build it from source with the toolchain set up above instead. The
          # v2 binaries are new enough, but v2 changed the default linter set
          # and reports pre-existing findings across the tree, so that is a
          # separate change.
          version: v1.64.8
          install-mode: goinstall
