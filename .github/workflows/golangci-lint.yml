name: golangci-lint
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
env:
  GO_VERSION: 1.26.2
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '${{ env.GO_VERSION }}'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@e60da84bfae8c7920a47be973d75e15710aa8bd7 # v6.3.0
        with:
          # Every released golangci-lint v1 binary is built with Go 1.24 or
          # older, and it refuses to run against a module targeting a newer
          # Go than it was built with:
          #   the Go language version (go1.24) used to build golangci-lint is
          #   lower than the targeted Go version (1.26.2)
          # Build it from source with the toolchain set up above instead. The
          # v2 binaries are new enough, but v2 changed the default linter set
          # and reports pre-existing findings across the tree, so that is a
          # separate change.
          version: v1.64.8
          install-mode: goinstall
